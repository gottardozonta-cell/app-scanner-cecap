<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#00695C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Magazzino Facile</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing:border-box; font-family:Arial,sans-serif; }
    body { margin:0; background:#f5f5f5; }
    header { display:flex; align-items:center; justify-content:space-between; background:#00695C; color:#fff; padding:10px; position:sticky; top:0; z-index:10; }
    header button { background:#fff; color:#00695C; border:none; padding:10px 14px; font-size:16px; border-radius:8px; font-weight:bold; }
    .title { font-size:20px; font-weight:bold; }
    .view { padding:12px; padding-bottom:80px; }
    button.big { width:100%; min-height:60px; font-size:20px; border:none; border-radius:10px; margin-top:10px; font-weight:bold; }
    .btn-primary { background:#00695C; color:#fff; }
    .btn-orange { background:#E65100; color:#fff; }
    .btn-red { background:#B71C1C; color:#fff; }
    .btn-dark { background:#880E4F; color:#fff; }
    .row { display:flex; gap:8px; }
    .row button { flex:1; }
    input, select { width:100%; font-size:20px; padding:12px; margin-top:6px; border:2px solid #00695C; border-radius:8px; background:#fff; }
    label { font-size:16px; font-weight:bold; margin-top:12px; display:block; }
    #camera { width:100%; min-height:280px; background:#000; border-radius:10px; overflow:hidden; margin-top:8px; }
    .card { border-radius:12px; padding:14px; margin-top:10px; display:flex; gap:12px; align-items:center; }
    .card.pending { background:#E0F7FA; }
    .card.done { background:#1B5E20; color:#fff; }
    .card img { width:130px; height:130px; object-fit:contain; background:#fff; border-radius:8px; }
    .name { font-size:24px; font-weight:bold; }
    .desc { font-size:16px; }
    .count { font-size:60px; font-weight:bold; line-height:1; }
    .msg { padding:10px 12px; font-size:18px; font-weight:bold; min-height:20px; }
    .err { color:#B71C1C; }
    .swatch { display:inline-block; width:28px; height:28px; border-radius:6px; vertical-align:middle; margin:0 8px; border:1px solid #999; }
    nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:#004D40; }
    nav button { flex:1; background:transparent; color:#fff; border:none; padding:16px; font-size:16px; font-weight:bold; }
    nav button.active { background:#00695C; }
    .hidden { display:none !important; }
    .colitem { display:flex; align-items:center; padding:10px; font-size:18px; background:#fff; border-radius:8px; margin-top:6px; }
    .colitem.sel { outline:4px solid #00695C; font-weight:bold; }
    .queue-list { width:100%; display:flex; flex-direction:column; gap:4px; }
    .queue-item { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-radius:8px; background:#fff; }
    .queue-item.current { background:#dff7e8; border:2px solid #00695C; }
    dialog { border:none; border-radius:12px; padding:20px; width:90%; max-width:400px; }
    dialog::backdrop { background:rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <header>
    <button id="authBtn">LOGIN</button>
    <div class="title" id="roleTitle">Magazziniere</div>
    <button id="settingsBtn">IMPOSTAZIONI</button>
  </header>

  <div id="msg" class="msg"></div>

  <div id="viewScanner" class="view">
    <div id="colIndicator" style="font-size:22px; font-weight:bold;"></div>
    <div id="camera"></div>
    <div id="productCard" class="card pending hidden">
      <img id="pPhoto" alt="">
      <div>
        <div class="name" id="pName"></div>
        <div class="desc" id="pDesc"></div>
        <div class="count" id="pCount"></div>
        <div id="pLabel" style="font-size:18px; font-weight:bold;"></div>
      </div>
    </div>
    <div id="productQueueList" class="card pending hidden" style="display:flex; flex-direction:column; align-items:stretch;">
      <div style="font-size:18px; font-weight:bold; margin-bottom:6px;">Prodotti da lavorare</div>
      <div id="queueContent" class="queue-list"></div>
    </div>
    <button class="big btn-primary" id="refreshBtn">&#x21BB; AGGIORNA VALORI DAL FOGLIO</button>
    <button class="big btn-primary" id="startWorkBtn">AVVIA LAVORO</button>
    <button class="big btn-primary hidden" id="startColumnBtn">AVVIA COLONNA</button>
    <button class="big btn-orange hidden" id="nextAutoBtn">PROSSIMO PRODOTTO</button>
    <button class="big btn-orange" id="undoBtn">&#8617; INDIETRO (annulla ultima scansione)</button>
    <button class="big btn-red hidden" id="resetColBtn">RICOMINCIA COLONNA DA ZERO</button>
    <button class="big btn-dark hidden" id="resetAllBtn">AZZERA TUTTI I CONTEGGI</button>
  </div>

  <div id="viewGestore" class="view hidden">
    <h2>Aggiungi / modifica prodotto</h2>
    <label>Codice</label><input id="fCode">
    <label>Codice a barre</label><input id="fBarcode">
    <label>Nome prodotto</label><input id="fName">
    <label>Descrizione</label><input id="fDesc">
    <label>Quantità (nella colonna attiva)</label><input id="fQty" type="number" inputmode="numeric">
    <label>Foto prodotto (dalla galleria o fotocamera)</label><input id="fPhoto" type="file" accept="image/*">
    <label>Foto da Google Drive (URL completo o ID file)</label><input id="fPhotoDrive" placeholder="https://drive.google.com/file/d/... oppure ID del file">
    <button class="big btn-primary" id="saveProductBtn">SALVA NEL FOGLIO</button>
    <h2>Scegli la colonna countdown</h2>
    <p>Tocca una colonna per attivarla (K, L, M, N, O, P, Q...):</p>
    <div id="colList"></div>
  </div>

  <div id="viewSettings" class="view hidden">
    <h2>Impostazioni</h2>
    <label>ID foglio Google / link Drive (il gid nella URL viene rispettato)</label><input id="sSheet" placeholder="https://docs.google.com/spreadsheets/d/...#gid=123 oppure ID">
    <label>File Excel locale (.xlsx, .xls, .csv)</label><input id="sLocalFile" type="file" accept=".xlsx,.xls,.csv">
    <button class="big btn-primary" id="loadLocalFileBtn">CARICA FILE LOCALE</button>
    <div id="localInfo" style="margin-top:6px; font-size:16px;"></div>
    <label>Sorgente dati attiva</label>
    <select id="sSource">
      <option value="sheet">Foglio Google / Drive</option>
      <option value="local">File locale caricato</option>
    </select>
    <div id="gestoreSettings" class="hidden">
      <label>Nome scheda/tab (opzionale, es. Foglio1)</label><input id="sSheetTab" placeholder="Lascia vuoto per usare il gid della URL">
      <label>Colonna codice a barre</label><input id="sBarcodeCol">
      <label>Colonna nome prodotto</label><input id="sNameCol">
      <label>Colonna descrizione</label><input id="sDescCol">
      <label>Colonna foto (URL)</label><input id="sPhotoCol">
      <label>Colonna quantità attiva (K, L, M, N, O, P, Q...)</label><input id="sQtyCol">
    </div>
    <button class="big btn-primary" id="diagBtn">MOSTRA DIAGNOSTICA COLONNE</button>
    <pre id="diagOut" style="white-space:pre-wrap; font-size:14px; background:#fff; padding:10px; border-radius:8px; max-height:300px; overflow:auto;"></pre>
    <button class="big btn-primary" id="startSelectedColumnBtn">AVVIA COLONNA</button>
    <button class="big btn-primary" id="saveSettingsBtn">SALVA E RICARICA</button>
    <button class="big btn-primary" id="backToScannerBtn">TORNA ALLO SCANNER</button>
    <div style="text-align:center; opacity:.55; margin-top:24px; font-size:14px;">Magazzino Facile v2.4</div>
  </div>

  <nav id="bottomNav" class="hidden">
    <button data-view="viewScanner" class="active">SCANNER</button>
    <button data-view="viewGestore">GESTIONE</button>
    <button data-view="viewSettings">IMPOSTAZIONI</button>
  </nav>

  <dialog id="loginDialog">
    <h2>Login Gestore</h2>
    <label>User ID</label><input id="loginUser" value="Gestore">
    <label>Password</label><input id="loginPass" type="password">
    <div class="row">
      <button class="big btn-primary" id="doLoginBtn">ACCEDI</button>
      <button class="big" id="cancelLoginBtn">ANNULLA</button>
    </div>
  </dialog>

  <script>
    const $ = id => document.getElementById(id);
    const DEFAULTS = {
      scriptUrl: '',
      token: '',
      spreadsheetId: '',
      sheetGid: '0',
      sheetTab: '',
      sourceType: 'sheet',
      barcodeColumn: 'E',
      nameColumn: 'C',
      descColumn: 'F',
      photoColumn: 'P',
      activeQtyColumn: 'K',
      localSheetData: null
    };

    let settings = loadSettings();
    let role = localStorage.getItem('role') || 'MAGAZZINIERE';
    let columnsMeta = [];
    let currentProduct = null;
    let historyStack = [];
    let lastScan = { code: null, time: 0 };
    let scanner = null;
    let autoQueue = [];
    let autoIndex = 0;
    let autoMode = false;

    /* ================= IDENTIFICAZIONE FOGLIO ================= */

    function normalizeSpreadsheetId(value) {
      if (!value) return '';
      const raw = String(value).trim();
      if (!raw) return '';
      const patterns = [
        /(?:https?:\/\/)?drive\.google\.com\/file\/d\/([a-z0-9_-]{10,})/i,
        /(?:https?:\/\/)?drive\.google\.com\/d\/([a-z0-9_-]{10,})/i,
        /(?:https?:\/\/)?drive\.google\.com\/open\?id=([a-z0-9_-]{10,})/i,
        /(?:[?&]id=)([a-z0-9_-]{10,})/i,
        /(?:https?:\/\/)?docs\.google\.com\/spreadsheets\/d\/([a-z0-9_-]{10,})/i,
        /(?:https?:\/\/)?docs\.google\.com\/d\/([a-z0-9_-]{10,})/i,
        /(?:https?:\/\/)?spreadsheets\.google\.com\/d\/([a-z0-9_-]{10,})/i,
        /key=([a-z0-9_-]+)/i,
        /^([a-z0-9_-]{10,})$/i
      ];
      for (const pattern of patterns) {
        const match = raw.match(pattern);
        if (match && match[1]) return match[1];
      }
      try {
        const u = new URL(raw);
        const host = (u.hostname || '').toLowerCase();
        const path = (u.pathname || '').toLowerCase();
        if (host.includes('docs.google.com') || host.includes('drive.google.com')) {
          const m = path.match(/\/spreadsheets\/d\/([a-z0-9_-]{10,})/i) || path.match(/\/d\/([a-z0-9_-]{10,})/i) || path.match(/\/file\/d\/([a-z0-9_-]{10,})/i);
          if (m && m[1]) return m[1];
          const qid = u.searchParams.get('id');
          if (qid && /^[a-z0-9_-]{10,}$/i.test(qid)) return qid;
        }
      } catch (e) {}
      return raw;
    }

    // Estrae il gid (scheda) dalla URL incollata, es. #gid=123456 oppure &gid=123456
    function extractGid(raw) {
      const m = String(raw || '').match(/[#?&]gid=(\d+)/i);
      return m ? m[1] : null;
    }

    function detectSourceType(value) {
      const raw = (value || '').trim();
      if (!raw) return 'sheet';
      const low = raw.toLowerCase();
      if (low.includes('drive.google.com') || low.includes('/file/d/')) return 'drive';
      if (low.includes('docs.google.com/spreadsheets') || low.includes('/spreadsheets/d/')) return 'sheet';
      return 'sheet';
    }

    function normalizeColumnSpec(spec) {
      const raw = String(spec || '').trim();
      if (/^[A-Za-z]{1,3}$/.test(raw)) return raw.toUpperCase();
      return raw;
    }

    function loadSettings() {
      try {
        const parsed = JSON.parse(localStorage.getItem('settings') || '{}');
        const normalized = Object.assign({}, DEFAULTS, parsed);
        normalized.localSheetData = parsed.localSheetData || null;
        const rawSpreadsheet = parsed.spreadsheetId || normalized.spreadsheetId || '';
        if (rawSpreadsheet) normalized.spreadsheetId = normalizeSpreadsheetId(rawSpreadsheet);
        const gid = extractGid(rawSpreadsheet);
        if (gid) normalized.sheetGid = gid;
        // FIX: la sorgente scelta (file locale o foglio) va rispettata dopo il ricaricamento
        if (parsed.sourceType === 'local') {
          normalized.sourceType = normalized.localSheetData ? 'local' : 'sheet';
        } else if (normalized.spreadsheetId) {
          normalized.sourceType = detectSourceType(rawSpreadsheet);
        } else if (normalized.localSheetData) {
          normalized.sourceType = 'local';
        } else {
          normalized.sourceType = 'sheet';
        }
        normalized.activeQtyColumn = normalizeColumnSpec(normalized.activeQtyColumn) || 'K';
        return normalized;
      } catch (e) {
        return Object.assign({}, DEFAULTS);
      }
    }

    function saveSettings() {
      try {
        localStorage.setItem('settings', JSON.stringify(settings));
        return true;
      } catch (e) {
        // Il file locale è troppo grande per la memoria del browser: salva le
        // impostazioni SENZA i dati del file (restano in memoria finché la pagina è aperta)
        try {
          const lite = Object.assign({}, settings, { localSheetData: null });
          localStorage.setItem('settings', JSON.stringify(lite));
        } catch (e2) {}
        showMsg('File troppo grande per la memoria del browser: funzionerà finché non chiudi o ricarichi la pagina.', true);
        return false;
      }
    }

    function showMsg(text, isErr) {
      const m = $('msg');
      m.textContent = text || '';
      m.className = 'msg' + (isErr ? ' err' : '');
    }

    function convertDriveUrl(raw) {
      if (!raw) return '';
      const value = String(raw).trim();
      if (!value) return '';
      const googleId = value.match(/(?:\/d\/|id=)([a-z0-9_-]{10,})/i);
      if (googleId && googleId[1]) return 'https://drive.google.com/uc?export=view&id=' + googleId[1];
      if (/^https?:\/\//i.test(value)) return value;
      if (/^[a-z0-9_-]{10,}$/i.test(value)) return 'https://drive.google.com/uc?export=view&id=' + value;
      return value;
    }

    /* ================= LETTURA POSIZIONALE DELLE COLONNE =================
       FIX PRINCIPALE: i dati vengono mantenuti come MATRICE (array di array).
       La colonna K è SEMPRE l'indice 10, la L l'11, la M il 12, la N il 13,
       la O il 14, la P il 15, la Q il 16 — a prescindere dalle intestazioni.
    */

    function columnLetterFromIndex(index) {
      let n = index + 1;
      let letters = '';
      while (n > 0) {
        const rem = (n - 1) % 26;
        letters = String.fromCharCode(65 + rem) + letters;
        n = Math.floor((n - 1) / 26);
      }
      return letters;
    }

    function columnIndexFromLetter(letter) {
      const name = (letter || '').toUpperCase().replace(/[^A-Z]/g, '');
      if (!name) return -1;
      let value = 0;
      for (let i = 0; i < name.length; i++) value = value * 26 + (name.charCodeAt(i) - 64);
      return value - 1;
    }

    function isBlankCell(c) {
      return c === null || c === undefined || String(c).trim() === '';
    }

    function fmtCell(c) {
      if (c === null || c === undefined) return '';
      if (typeof c === 'number') {
        if (Number.isInteger(c) && Math.abs(c) < 1e15) return String(c);
        return c;
      }
      if (c instanceof Date) return String(c);
      return String(c).trim();
    }

    // Converte una matrice grezza (prima riga = intestazioni) in tabella posizionale
    function tableFromMatrix(rawMatrix) {
      const matrix = (rawMatrix || []).map(r => Array.isArray(r) ? r.map(fmtCell) : []);
      // salta eventuali righe iniziali completamente vuote
      while (matrix.length && matrix[0].every(isBlankCell)) matrix.shift();
      if (!matrix.length) return { headers: [], rows: [] };
      const width = matrix.reduce((m, r) => Math.max(m, r.length), 0);
      const headRow = matrix[0];
      const headers = [];
      for (let i = 0; i < width; i++) {
        const label = String(headRow[i] ?? '').trim();
        headers.push(label || ('Colonna ' + columnLetterFromIndex(i)));
      }
      const rows = [];
      for (let i = 1; i < matrix.length; i++) {
        const r = matrix[i].slice(0, width);
        while (r.length < width) r.push('');
        if (r.some(c => !isBlankCell(c))) rows.push(r);
      }
      return { headers, rows };
    }

    // Converte i vecchi dati salvati (oggetti per intestazione) nel nuovo formato
    function coerceTable(data) {
      if (!data) return null;
      if (Array.isArray(data.matrix)) {
        return tableFromMatrix([data.headers || [], ...data.matrix]);
      }
      if (Array.isArray(data.rows) && Array.isArray(data.headers)) {
        const matrix = [data.headers, ...data.rows.map(r => data.headers.map(h => r[h] ?? ''))];
        return tableFromMatrix(matrix);
      }
      return null;
    }

    // Risolve la colonna: prima per NOME intestazione esatto, poi per LETTERA (K=10, L=11, ...)
    function resolveColumnIndex(spec, headers) {
      const text = String(spec || '').trim();
      if (!text) return -1;
      const normalized = text.toLowerCase();
      const byName = headers.findIndex(h => String(h || '').trim().toLowerCase() === normalized);
      if (byName >= 0) return byName;
      if (/^[A-Za-z]{1,3}$/.test(text)) return columnIndexFromLetter(text);
      const partial = headers.findIndex(h => String(h || '').trim().toLowerCase().includes(normalized));
      return partial;
    }

    function toNumber(value) {
      if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
      if (value === null || value === undefined) return 0;
      let txt = String(value).trim().replace(/\s+/g, '');
      if (!txt) return 0;
      if (txt.includes(',')) txt = txt.replace(/\./g, '').replace(',', '.');
      const parsed = parseFloat(txt);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    // Riconosce valori "tipo codice a barre": numerici EAN/UPC/ITF oppure
    // alfanumerici che contengono almeno una cifra (Code39 ecc.). Esclude i nomi
    // puramente testuali come "Martello".
    function looksLikeBarcode(v) {
      const t = String(v ?? '').trim();
      if (!t) return false;
      if (/^\d{6,15}$/.test(t)) return true;
      return /^(?=.*\d)[A-Z0-9][A-Z0-9.\-]{5,24}$/i.test(t);
    }

    // Trova la colonna con più valori "tipo barcode" (escludendo quantità/nome/desc/foto)
    function detectBarcodeIndex(rows, headers, excludeIdx) {
      const excluded = new Set((excludeIdx || []).filter(i => i >= 0));
      let best = -1;
      let bestScore = 0;
      for (let i = 0; i < headers.length; i++) {
        if (excluded.has(i)) continue;
        let score = 0;
        rows.forEach(r => { if (looksLikeBarcode(r[i])) score++; });
        if (score > bestScore) { bestScore = score; best = i; }
      }
      return bestScore >= 2 ? best : -1;
    }

    function buildColumnsMeta(headers) {
      const palette = ['#4CAF50', '#FF9800', '#2196F3', '#9C27B0', '#E91E63', '#00BCD4', '#795548', '#607D8B'];
      return headers.map((header, index) => ({
        letter: columnLetterFromIndex(index),
        header: header || ('Colonna ' + columnLetterFromIndex(index)),
        color: palette[index % palette.length]
      }));
    }

    // Ricerca prodotti su una tabella posizionale — unica logica per tutte le sorgenti
    function searchTable(table, params) {
      const headers = table.headers || [];
      const rows = table.rows || [];
      if (!headers.length) return { ok: false, error: 'Tabella vuota o non leggibile.' };

      if (params.action === 'meta') return { ok: true, columns: buildColumnsMeta(headers) };

      const lastCol = columnLetterFromIndex(headers.length - 1);
      const barcodeIndex = resolveColumnIndex(params.barcodeColumn, headers);
      const nameIndex = resolveColumnIndex(params.nameColumn, headers);
      const descIndex = resolveColumnIndex(params.descColumn, headers);
      const photoIndex = resolveColumnIndex(params.photoColumn, headers);
      const qtyIndex = resolveColumnIndex(params.qtyColumn, headers);

      if (params.action === 'diag') {
        const lines = [];
        lines.push('Sorgente: ' + (settings.sourceType === 'local' ? 'FILE LOCALE' : 'FOGLIO GOOGLE/DRIVE'));
        lines.push('Righe dati: ' + rows.length + ' | Colonne: ' + headers.length + ' (A..' + lastCol + ')');
        headers.forEach((h, i) => {
          let nonEmpty = 0;
          let nums = 0;
          let bclike = 0;
          rows.forEach(r => {
            if (!isBlankCell(r[i])) nonEmpty++;
            if (toNumber(r[i]) > 0) nums++;
            if (looksLikeBarcode(r[i])) bclike++;
          });
          if (nonEmpty > 0) lines.push('Col. ' + columnLetterFromIndex(i) + ' "' + h + '": celle piene=' + nonEmpty + ' | numeri>0=' + nums + ' | tipoBarcode=' + bclike);
        });
        const suggested = detectBarcodeIndex(rows, headers, [qtyIndex, nameIndex, descIndex, photoIndex]);
        lines.push('Colonna codici suggerita: ' + (suggested >= 0
          ? columnLetterFromIndex(suggested) + (suggested === barcodeIndex ? ' (gia configurata)' : ' (configurata ora: ' + params.barcodeColumn + ')')
          : 'nessuna rilevata (configurata: ' + params.barcodeColumn + ')'));
        [['barcode', barcodeIndex], ['quantita', qtyIndex]].forEach(pair => {
          if (pair[1] >= 0 && pair[1] < headers.length) {
            const samples = rows.slice(0, 3).map(r => '"' + String(r[pair[1]] ?? '') + '"').join(', ');
            lines.push('Campioni col. ' + pair[0] + ' (' + columnLetterFromIndex(pair[1]) + '): ' + samples);
          }
        });
        return { ok: true, report: lines.join('\n') };
      }

      if (qtyIndex < 0) return { ok: false, error: 'Colonna quantità "' + params.qtyColumn + '" non trovata nel foglio.' };
      if (qtyIndex >= headers.length) return { ok: false, error: 'La colonna quantità ' + params.qtyColumn + ' non esiste nel foglio: l\'ultima colonna disponibile è ' + lastCol + '. Verifica scheda (gid) e foglio corretti.' };

      const cell = (row, i) => (i >= 0 && i < row.length ? row[i] : '');

      // Se la colonna codice a barre configurata è vuota o inesistente, la rileva automaticamente
      let usedBarcodeIndex = barcodeIndex;
      let autoBarcodeCol = null;
      const barcodeMissing = barcodeIndex < 0 || barcodeIndex >= headers.length ||
        !rows.some(r => String(cell(r, barcodeIndex) ?? '').trim() !== '');
      if (barcodeMissing && (params.action === 'getProduct' || params.action === 'listProductsForColumn')) {
        const detected = detectBarcodeIndex(rows, headers, [qtyIndex, nameIndex, descIndex, photoIndex]);
        if (detected >= 0) {
          usedBarcodeIndex = detected;
          autoBarcodeCol = columnLetterFromIndex(detected);
        }
      }
      if (usedBarcodeIndex < 0 || usedBarcodeIndex >= headers.length) {
        return { ok: false, error: 'Colonna codice a barre "' + params.barcodeColumn + '" vuota o inesistente: indica la lettera corretta in IMPOSTAZIONI (ultima colonna: ' + lastCol + ').' };
      }

      const makeProduct = (row, rowIndex) => ({
        barcode: String(cell(row, usedBarcodeIndex) || '').trim(),
        name: String(cell(row, nameIndex) || ''),
        description: String(cell(row, descIndex) || ''),
        photoUrl: String(cell(row, photoIndex) || ''),
        quantity: toNumber(cell(row, qtyIndex)),
        qtyColumn: normalizeColumnSpec(params.qtyColumn),
        barcodeColumn: autoBarcodeCol || normalizeColumnSpec(params.barcodeColumn),
        rowIndex
      });

      if (params.action === 'getProduct') {
        const targetCode = String(params.barcode || '').trim();
        const idx = rows.findIndex(r => String(cell(r, usedBarcodeIndex) || '').trim() === targetCode);
        if (idx < 0) return { ok: true, product: null };
        return { ok: true, product: makeProduct(rows[idx], idx), autoBarcodeCol };
      }

      if (params.action === 'listProductsForColumn') {
        const products = [];
        let withBarcode = 0;
        let withQty = 0;
        rows.forEach((row, rowIndex) => {
          const p = makeProduct(row, rowIndex);
          if (p.barcode) withBarcode++;
          if (p.quantity > 0) withQty++;
          if (!p.barcode || p.quantity <= 0) return;
          products.push(p);
        });
        return { ok: true, products, autoBarcodeCol, stats: { rows: rows.length, withBarcode, withQty } };
      }

      return { ok: false, error: 'Azione non supportata.' };
    }

    /* ================= PARSER SORGENTI ================= */

    function parseCsvRows(text) {
      const rows = [];
      let current = '';
      let row = [];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (ch === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          row.push(current);
          current = '';
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && next === '\n') i++;
          row.push(current);
          if (row.some(cell => cell !== '')) rows.push(row);
          row = [];
          current = '';
        } else {
          current += ch;
        }
      }
      if (current.length || row.length) {
        row.push(current);
        if (row.some(cell => cell !== '')) rows.push(row);
      }
      return rows;
    }

    // gviz JSON -> matrice posizionale (gli array r.c mantengono l'ordine esatto delle colonne)
    function matrixFromGviz(text) {
      const normalized = (text || '').trim();
      if (!normalized) return [];
      try {
        const cleaned = normalized
          .replace(/^\s*\]\s*}\s*/i, '')
          .replace(/^\s*\/\*.*?\*\/\s*/s, '')
          .replace(/^\s*google\.visualization\.Query\.setResponse\s*\(/, '')
          .replace(/\)\s*;?\s*$/, '');
        const payload = JSON.parse(cleaned);
        const cols = payload && payload.table && payload.table.cols ? payload.table.cols : [];
        const gvizRows = payload && payload.table && payload.table.rows ? payload.table.rows : [];
        const headerRow = cols.map(c => (c && c.label ? String(c.label).trim() : ''));
        const dataRows = gvizRows.map(r => (r && r.c ? r.c : []).map(cell =>
          (cell && cell.v !== null && cell.v !== undefined) ? cell.v : ''
        ));
        return [headerRow, ...dataRows];
      } catch (e) {
        throw new Error('Risposta JSON del foglio Google non valida.');
      }
    }

    // Legge un foglio Excel cella per cella ANCORANDOLO ad A1: anche se il file ha
    // colonne o righe iniziali vuote, A resta l'indice 0 e la K l'indice 10.
    // Se una cella ha una formula senza valore salvato, usa il testo visualizzato (w).
    function matrixFromWorksheet(ws) {
      if (!ws || !ws['!ref']) return [];
      const ref = XLSX.utils.decode_range(ws['!ref']);
      const out = [];
      for (let r = 0; r <= ref.e.r; r++) {
        const row = [];
        for (let c = 0; c <= ref.e.c; c++) {
          const cellObj = ws[XLSX.utils.encode_cell({ r, c })];
          let v = '';
          if (cellObj) {
            if (cellObj.v !== undefined && cellObj.v !== null) v = cellObj.v;
            else if (cellObj.w !== undefined && cellObj.w !== null) v = cellObj.w;
          }
          row.push(v);
        }
        out.push(row);
      }
      return out;
    }

    async function fetchGoogleSheetData(url, label) {
      const res = await fetch(url, { cache: 'no-store' });
      const text = await res.text();
      if (!res.ok) throw new Error(label + ' non raggiungibile: ' + res.status + ' ' + res.statusText);
      const trimmed = (text || '').trim();
      if (!trimmed) throw new Error(label + ' ha restituito un contenuto vuoto.');
      if (/^<!doctype html|^<html/i.test(trimmed)) {
        throw new Error('Il foglio non è pubblico oppure l\'ID è errato. Condividi il file come "Chiunque abbia il link".');
      }
      return text;
    }

    // Scarica e restituisce SEMPRE una tabella posizionale { headers, rows }
    async function fetchSheetTable() {
      const sheetId = normalizeSpreadsheetId(settings.spreadsheetId);
      const sourceType = settings.sourceType || detectSourceType(settings.spreadsheetId || '');

      if (sourceType === 'drive') {
        // FIX: il file Drive è un xlsx BINARIO: va letto con la libreria XLSX, non come testo CSV
        if (typeof XLSX === 'undefined') throw new Error('Libreria Excel non caricata: serve connessione internet.');
        const res = await fetch('https://drive.google.com/uc?export=download&id=' + sheetId + '&_=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('File Drive non raggiungibile: ' + res.status + ' ' + res.statusText);
        const buffer = await res.arrayBuffer();
        const headText = new TextDecoder().decode(buffer.slice(0, 512)).trim();
        if (/^<!doctype html|^<html/i.test(headText)) {
          throw new Error('Il file Drive non è pubblico oppure richiede conferma. Condividilo come "Chiunque abbia il link".');
        }
        const workbook = XLSX.read(buffer, { type: 'array' });
        const tabName = (settings.sheetTab && workbook.SheetNames.includes(settings.sheetTab)) ? settings.sheetTab : workbook.SheetNames[0];
        if (!tabName) throw new Error('Il file non contiene fogli.');
        const matrix = matrixFromWorksheet(workbook.Sheets[tabName]);
        return tableFromMatrix(matrix);
      }

      const gid = settings.sheetGid || '0';
      const gvizBase = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:json';
      const attempts = [];
      // Se è stato indicato il nome della scheda, provalo per primo
      if (settings.sheetTab) attempts.push({ kind: 'gviz', url: gvizBase + '&sheet=' + encodeURIComponent(settings.sheetTab) });
      // CSV con il GID ESATTO preso dalla URL (fix: prima era sempre gid=0)
      attempts.push({ kind: 'csv', url: 'https://docs.google.com/spreadsheets/d/' + sheetId + '/export?format=csv&gid=' + gid + '&_=' + Date.now() });
      attempts.push({ kind: 'gviz', url: gvizBase + '&gid=' + encodeURIComponent(gid) });
      attempts.push({ kind: 'gviz', url: gvizBase });

      let lastError = null;
      for (const attempt of attempts) {
        try {
          const text = await fetchGoogleSheetData(attempt.url, 'Foglio Google');
          const matrix = attempt.kind === 'gviz' ? matrixFromGviz(text) : parseCsvRows(text);
          const table = tableFromMatrix(matrix);
          if (!table.headers.length) throw new Error('Il foglio è vuoto.');
          return table;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error('Impossibile leggere il foglio. Verifica ID e permessi del file.');
    }

    function commonParams() {
      return {
        token: settings.token,
        spreadsheetId: settings.spreadsheetId,
        sourceType: settings.sourceType || 'sheet',
        barcodeColumn: settings.barcodeColumn,
        nameColumn: settings.nameColumn,
        descColumn: settings.descColumn,
        photoColumn: settings.photoColumn,
        qtyColumn: settings.activeQtyColumn
      };
    }

    function localSheetFetch(params) {
      const rawData = settings.localSheetData || JSON.parse(localStorage.getItem('localSheetData') || 'null');
      const table = coerceTable(rawData);
      if (!table || !table.rows.length) return { ok: false, error: 'Nessun file locale caricato.' };
      return searchTable(table, params);
    }

    async function directSheetFetch(params) {
      if (!settings.spreadsheetId) return { ok: false, error: 'ID foglio Google mancante.' };
      try {
        const table = await fetchSheetTable();
        return searchTable(table, params);
      } catch (e) {
        return { ok: false, error: e.message };
      }
    }

    async function apiGet(params) {
      if (settings.sourceType === 'local' && settings.localSheetData) return localSheetFetch(params);
      if (settings.spreadsheetId) return await directSheetFetch(params);
      if (settings.localSheetData) return localSheetFetch(params);
      throw new Error('Inserisci un link Drive, un ID del foglio Google oppure carica un file locale.');
    }

    /* ================= CONTEGGI CON RILEVAZIONE CAMBI VALORE =================
       Ogni conteggio salvato include il "base" = valore letto dal foglio.
       Se il gestore CAMBIA il valore nella colonna (K, L, M...), alla prossima
       lettura il valore base non corrisponde più e il conteggio si riallinea
       automaticamente al nuovo valore del foglio.
    */

    function countKey(p) {
      return 'count_' + p.barcode + '_' + p.qtyColumn;
    }

    function getStoredCount(key) {
      const raw = localStorage.getItem(key);
      if (raw === null) return null;
      try {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          return { remaining: Number(parsed.remaining), base: parsed.base ?? null };
        }
      } catch (e) {}
      const n = parseInt(raw, 10);
      return Number.isFinite(n) ? { remaining: n, base: null } : null;
    }

    function setStoredCount(key, remaining, base) {
      localStorage.setItem(key, JSON.stringify({ remaining, base, updated: Date.now() }));
    }

    // Ritorna i pezzi rimanenti, riallineandosi se il valore nel foglio è cambiato
    function remainingFor(p, decrement) {
      const key = countKey(p);
      const stored = getStoredCount(key);
      let before;
      if (!stored) {
        before = p.quantity;
      } else if (stored.base !== null && Number(stored.base) !== Number(p.quantity)) {
        before = p.quantity; // valore nella colonna cambiato -> riparti dal nuovo valore
      } else {
        before = Number(stored.remaining);
      }
      if (!Number.isFinite(before)) before = p.quantity;
      const remaining = decrement ? Math.max(before - 1, 0) : Math.max(before, 0);
      return { key, before, remaining };
    }

    /* ================= UI ================= */

    function renderColIndicator() {
      const col = columnsMeta.find(c => c.letter === settings.activeQtyColumn);
      $('colIndicator').innerHTML = 'COLONNA: ' + settings.activeQtyColumn +
        (col ? ' <span class="swatch" style="background:' + col.color + '"></span> ' + col.header : '');
    }

    function renderColList() {
      const c = $('colList');
      c.innerHTML = '';
      if (!columnsMeta.length) {
        c.innerHTML = '<p>Nessuna colonna caricata. Controlla le impostazioni.</p>';
        return;
      }
      columnsMeta.forEach(col => {
        const div = document.createElement('div');
        div.className = 'colitem' + (col.letter === settings.activeQtyColumn ? ' sel' : '');
        div.innerHTML = '<span class="swatch" style="background:' + col.color + '"></span><b>' + col.letter + '</b> - ' + (col.header || '(senza nome)');
        div.onclick = async () => {
          settings.activeQtyColumn = col.letter;
          saveSettings();
          renderColIndicator();
          renderColList();
          showMsg('Colonna attiva: ' + col.letter);
          if (role === 'GESTORE') {
            await startColumnSequence();
          }
        };
        c.appendChild(div);
      });
    }

    function escHtml(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    // Mostra un riepilogo del file locale e dei nomi delle colonne chiave (A, E, K, Q)
    function renderLocalInfo() {
      const el = $('localInfo');
      if (!el) return;
      const table = coerceTable(settings.localSheetData);
      if (!table || !table.headers.length) {
        el.textContent = 'Nessun file locale in memoria.';
        return;
      }
      const h = table.headers;
      el.innerHTML = 'File locale in memoria: <b>' + table.rows.length + ' righe</b>, colonne A..' + columnLetterFromIndex(h.length - 1) +
        '<br>A=' + escHtml(h[0]) + ' | E=' + escHtml(h[4] ?? '') + ' | K=' + escHtml(h[10] ?? '') + ' | Q=' + escHtml(h[16] ?? '');
    }

    function fillSettingsForm() {
      $('sSheet').value = settings.spreadsheetId;
      $('sSheetTab').value = settings.sheetTab || '';
      $('sSource').value = settings.sourceType === 'local' ? 'local' : 'sheet';
      $('sBarcodeCol').value = settings.barcodeColumn;
      $('sNameCol').value = settings.nameColumn;
      $('sDescCol').value = settings.descColumn;
      $('sPhotoCol').value = settings.photoColumn;
      $('sQtyCol').value = settings.activeQtyColumn;
      renderLocalInfo();
    }

    function resetColumnCounters(column) {
      const col = normalizeColumnSpec(column || settings.activeQtyColumn || '');
      if (!col) return;
      Object.keys(localStorage)
        .filter(key => key.startsWith('count_') && key.endsWith('_' + col))
        .forEach(key => localStorage.removeItem(key));
      historyStack = historyStack.filter(entry => !String(entry.key || '').endsWith('_' + col));
    }

    function clearAutoQueueState() {
      autoQueue = [];
      autoIndex = 0;
      autoMode = false;
      currentProduct = null;
      renderQueueList();
      $('productCard').classList.add('hidden');
    }

    function renderQueueList() {
      const box = $('productQueueList');
      const content = $('queueContent');
      if (!autoQueue.length) {
        box.classList.add('hidden');
        content.innerHTML = '';
        return;
      }
      box.classList.remove('hidden');
      content.innerHTML = autoQueue.map((p, idx) => {
        const isCurrent = idx === autoIndex;
        const qty = Number(p.quantity) || 0;
        return `
          <div class="queue-item ${isCurrent ? 'current' : ''}">
            <span>${idx + 1}. ${p.name || 'Prodotto'}</span>
            <strong>${qty}</strong>
          </div>
        `;
      }).join('');
    }

    function finishAutoSequence() {
      autoMode = false;
      autoQueue = [];
      autoIndex = 0;
      currentProduct = null;
      renderQueueList();
      $('productCard').classList.add('hidden');
      showMsg('FINE LAVORO');
    }

    function showNextAutoProduct() {
      if (!autoQueue.length || autoIndex >= autoQueue.length) {
        finishAutoSequence();
        return;
      }
      const product = autoQueue[autoIndex];
      currentProduct = product;
      const { remaining } = remainingFor(product, false);
      renderProduct(product, remaining);
      renderQueueList();
      showMsg('Prodotto ' + (autoIndex + 1) + ' di ' + autoQueue.length + ': ' + (product.name || 'Prodotto') + ' - ' + product.quantity + ' pezzi');
    }

    function renderProduct(p, remaining) {
      const done = remaining <= 0 && (Number(p.quantity) || 0) > 0;
      $('productCard').className = 'card ' + (done ? 'done' : 'pending');
      $('pName').textContent = p.name || 'Prodotto';
      $('pDesc').textContent = p.description || '';
      $('pCount').textContent = done ? 'FATTO!' : remaining;
      $('pLabel').textContent = done ? 'PRODOTTO FINITO' : 'PEZZI RIMANENTI';
      const photoUrl = convertDriveUrl(p.photoUrl || '');
      if (photoUrl) {
        $('pPhoto').src = photoUrl;
        $('pPhoto').style.display = 'block';
      } else {
        $('pPhoto').style.display = 'none';
      }
      $('productCard').classList.remove('hidden');
    }

    async function startColumnSequence() {
      if (!settings.spreadsheetId && !settings.localSheetData) {
        showMsg('Inserisci prima il foglio Google, il link Drive o carica un file locale.', true);
        return;
      }

      resetColumnCounters(settings.activeQtyColumn);
      clearAutoQueueState();
      showMsg('Carico prodotti della colonna ' + settings.activeQtyColumn + '...');

      try {
        const res = await apiGet(Object.assign({ action: 'listProductsForColumn' }, commonParams()));
        if (!res.ok) {
          showMsg(res.error || 'Errore nella lettura del foglio', true);
          return;
        }

        const items = (res.products || [])
          .filter(p => (p.barcode || '').trim())
          .filter(p => Number(p.quantity) > 0)
          .map(p => ({ ...p }));

        // Se la colonna codici è stata rilevata automaticamente, la salva e lo segnala
        let autoNote = '';
        if (res.autoBarcodeCol && res.autoBarcodeCol !== settings.barcodeColumn) {
          autoNote = 'Colonna codici rilevata automaticamente: ' + res.autoBarcodeCol + '. ';
          settings.barcodeColumn = res.autoBarcodeCol;
          saveSettings();
        }

        if (!items.length) {
          autoQueue = [];
          autoIndex = 0;
          autoMode = false;
          renderQueueList();
          const st = res.stats || { rows: 0, withBarcode: 0, withQty: 0 };
          showMsg(autoNote + 'Nessun prodotto valido nella colonna ' + settings.activeQtyColumn +
            ' | Sorgente: ' + (settings.sourceType === 'local' ? 'FILE LOCALE' : 'FOGLIO GOOGLE') +
            ' | Righe lette: ' + st.rows +
            ' | barcode in col. ' + (res.autoBarcodeCol || settings.barcodeColumn) + ': ' + st.withBarcode +
            ' | quantità > 0 in col. ' + settings.activeQtyColumn + ': ' + st.withQty +
            '. Controlla sorgente e colonne in IMPOSTAZIONI.', true);
          return;
        }

        autoQueue = items;
        autoIndex = 0;
        autoMode = true;
        renderQueueList();
        showNextAutoProduct();
        showMsg(autoNote + 'Colonna ' + settings.activeQtyColumn + ' avviata. Inquadra il codice del prodotto corrente.', false);
      } catch (e) {
        autoQueue = [];
        autoIndex = 0;
        autoMode = false;
        renderQueueList();
        showMsg('Errore caricamento colonna: ' + e.message, true);
      }
    }

    // Rilegge il prodotto corrente dal foglio e riallinea il countdown se il
    // valore nella colonna attiva (K, L, M...) è cambiato
    async function refreshCurrentFromSource() {
      const target = (autoMode && autoQueue.length && autoIndex < autoQueue.length) ? autoQueue[autoIndex] : currentProduct;
      if (!target) {
        showMsg('Nessun prodotto attivo. Avvia prima una colonna o scansione un codice.', true);
        return;
      }
      showMsg('Aggiornamento valori dalla colonna ' + settings.activeQtyColumn + '...');
      try {
        const res = await apiGet(Object.assign({ action: 'getProduct', barcode: target.barcode }, commonParams()));
        if (!res.ok) { showMsg(res.error, true); return; }
        if (!res.product) { showMsg('Prodotto non trovato nel foglio', true); return; }
        const fresh = res.product;
        if (autoMode && autoQueue[autoIndex]) {
          autoQueue[autoIndex].quantity = fresh.quantity;
          autoQueue[autoIndex].name = fresh.name;
        }
        const { key, remaining } = remainingFor(fresh, false);
        setStoredCount(key, remaining, fresh.quantity);
        currentProduct = fresh;
        renderProduct(fresh, remaining);
        renderQueueList();
        showMsg('Aggiornato dalla colonna ' + settings.activeQtyColumn + ': ' + (fresh.name || 'Prodotto') + ' = ' + fresh.quantity + ' pezzi.');
      } catch (e) {
        showMsg('Errore aggiornamento: ' + e.message, true);
      }
    }

    function processAutoProductMatch(code) {
      if (!autoMode || !autoQueue.length) return true;
      const current = autoQueue[autoIndex];
      if (!current) {
        finishAutoSequence();
        return false;
      }
      if (String(code).trim() !== String(current.barcode || '').trim()) {
        showMsg('Codice sbagliato: serve ' + (current.name || current.barcode), true);
        return false;
      }
      return true;
    }

    function handleBarcode(code) {
      const normalizedCode = String(code || '').trim();
      showMsg('Ricerca: ' + normalizedCode + ' ...');

      if (autoMode && !processAutoProductMatch(normalizedCode)) return;

      apiGet(Object.assign({ action: 'getProduct', barcode: normalizedCode }, commonParams()))
        .then(res => {
          if (!res.ok) {
            showMsg(res.error, true);
            return;
          }
          if (!res.product) {
            showMsg('Prodotto non presente nel foglio', true);
            return;
          }

          const p = res.product;
          currentProduct = p;

          // riallinea la coda se il gestore ha cambiato il valore nella colonna
          if (autoMode && autoQueue[autoIndex] && Number(autoQueue[autoIndex].quantity) !== Number(p.quantity)) {
            autoQueue[autoIndex].quantity = p.quantity;
            renderQueueList();
          }

          const { key, before, remaining } = remainingFor(p, true);
          setStoredCount(key, remaining, p.quantity);
          historyStack.push({ key, before, base: p.quantity });
          renderProduct(p, remaining);

          if (autoMode) {
            if (remaining === 0) {
              showMsg('RIGA COMPLETATA: ' + (p.name || 'Prodotto') + '. Passo al successivo.', false);
              autoIndex += 1;
              renderQueueList();
              setTimeout(() => {
                if (autoIndex >= autoQueue.length) {
                  finishAutoSequence();
                  return;
                }
                showNextAutoProduct();
              }, 900);
              return;
            }
            showMsg('Mancano ' + remaining + ' per ' + (p.name || 'Prodotto'));
            return;
          }

          if (remaining === 0) {
            showMsg('COMPLETATO!');
          } else {
            showMsg('Mancano ' + remaining);
          }
        })
        .catch(e => {
          showMsg('Errore: ' + e.message, true);
        });
    }

    function onScan(code) {
      const now = Date.now();
      if (code === lastScan.code && now - lastScan.time < 1500) return;
      lastScan = { code, time: now };
      handleBarcode(code);
    }

    function startScanner() {
      if (scanner) return;
      if (typeof Html5Qrcode === 'undefined') {
        showMsg('Libreria scanner non caricata: serve connessione internet.', true);
        return;
      }
      let formats;
      try {
        formats = [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.QR_CODE
        ];
      } catch (e) {
        formats = undefined;
      }
      scanner = formats ? new Html5Qrcode('camera', { formatsToSupport: formats }) : new Html5Qrcode('camera');
      scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 160 } }, onScan, () => {})
        .catch(err => {
          showMsg('Fotocamera non disponibile: ' + err, true);
          scanner = null;
        });
    }

    function stopScanner() {
      if (scanner) {
        const s = scanner;
        scanner = null;
        s.stop().then(() => s.clear()).catch(() => {});
      }
    }

    function loadMeta() {
      if (!settings.spreadsheetId && !settings.scriptUrl && !settings.localSheetData) {
        showMsg('Vai in IMPOSTAZIONI e inserisci l\'ID del foglio Google, il link Drive o carica un file locale.', true);
        return;
      }
      apiGet(Object.assign({ action: 'meta' }, commonParams()))
        .then(res => {
          if (res.ok) {
            columnsMeta = res.columns || [];
            renderColIndicator();
            renderColList();
          } else {
            showMsg(res.error || 'Errore nel caricamento del foglio', true);
          }
        })
        .catch(e => showMsg('Errore collegamento: ' + e.message, true));
    }

    function applyRole() {
      const isGestore = role === 'GESTORE';
      $('roleTitle').textContent = isGestore ? 'Gestore' : 'Magazziniere';
      $('authBtn').textContent = isGestore ? 'LOGOUT' : 'LOGIN';
      $('settingsBtn').style.display = isGestore ? 'inline-block' : 'none';
      $('bottomNav').classList.toggle('hidden', !isGestore);
      $('resetColBtn').classList.toggle('hidden', !isGestore);
      $('resetAllBtn').classList.toggle('hidden', !isGestore);
      $('gestoreSettings').classList.toggle('hidden', !isGestore);
      $('startColumnBtn').classList.toggle('hidden', !isGestore);
      $('nextAutoBtn').classList.toggle('hidden', !isGestore);
      $('startWorkBtn').classList.toggle('hidden', isGestore);
      if (!isGestore) showView('viewScanner');
    }

    function showView(id) {
      if (id === 'viewSettings' && role !== 'GESTORE') id = 'viewScanner';
      ['viewScanner', 'viewGestore', 'viewSettings'].forEach(v => $(v).classList.toggle('hidden', v !== id));
      document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === id));
      if (id === 'viewScanner') startScanner(); else stopScanner();
    }

    function saveProductForm() {
      const code = ($('fCode').value || '').trim();
      const barcode = ($('fBarcode').value || '').trim();
      const name = ($('fName').value || '').trim();
      const desc = ($('fDesc').value || '').trim();
      const qty = Number(($('fQty').value || '').trim()) || 0;
      const photoDrive = ($('fPhotoDrive').value || '').trim();

      if (!barcode && !code) {
        showMsg('Inserisci almeno codice o barcode.', true);
        return;
      }

      const payload = {
        code: code || barcode,
        barcode: barcode || code,
        name,
        description: desc,
        quantity: qty,
        photoUrl: photoDrive,
        qtyColumn: settings.activeQtyColumn,
        savedAt: new Date().toISOString()
      };

      const key = 'product_' + (barcode || code);
      localStorage.setItem(key, JSON.stringify(payload));
      showMsg('Prodotto salvato localmente.', false);
      $('fCode').value = '';
      $('fBarcode').value = '';
      $('fName').value = '';
      $('fDesc').value = '';
      $('fQty').value = '';
      $('fPhotoDrive').value = '';
    }

    $('startWorkBtn').onclick = () => startColumnSequence();
    $('startColumnBtn').onclick = () => startColumnSequence();
    $('refreshBtn').onclick = () => refreshCurrentFromSource();
    $('saveProductBtn').onclick = saveProductForm;

    $('startSelectedColumnBtn').onclick = () => {
      settings.activeQtyColumn = normalizeColumnSpec($('sQtyCol').value) || settings.activeQtyColumn;
      saveSettings();
      renderColIndicator();
      renderColList();
      showMsg('Colonna attiva: ' + settings.activeQtyColumn);
      startColumnSequence();
    };

    $('nextAutoBtn').onclick = () => {
      if (!autoQueue.length) {
        showMsg('Nessuna colonna in esecuzione.', true);
        return;
      }
      autoIndex += 1;
      if (autoIndex >= autoQueue.length) {
        finishAutoSequence();
        return;
      }
      showNextAutoProduct();
    };

    $('undoBtn').onclick = () => {
      if (!historyStack.length) {
        showMsg('Niente da annullare');
        return;
      }
      const last = historyStack.pop();
      setStoredCount(last.key, last.before, last.base ?? null);
      showMsg('Annullato. Riportato a ' + last.before);
      if (currentProduct) renderProduct(currentProduct, last.before);
    };

    $('resetColBtn').onclick = () => {
      if (!confirm('Ricominciare TUTTA la colonna ' + settings.activeQtyColumn + ' da zero?')) return;
      resetColumnCounters(settings.activeQtyColumn);
      historyStack = [];
      $('productCard').className = 'card pending hidden';
      showMsg('Colonna ' + settings.activeQtyColumn + ' azzerata');
    };

    $('resetAllBtn').onclick = () => {
      if (!confirm('Azzerare TUTTI i conteggi di TUTTE le colonne?')) return;
      Object.keys(localStorage).filter(k => k.startsWith('count_')).forEach(k => localStorage.removeItem(k));
      historyStack = [];
      $('productCard').className = 'card pending hidden';
      showMsg('Tutti i conteggi azzerati');
    };

    $('authBtn').onclick = () => {
      if (role === 'GESTORE') {
        role = 'MAGAZZINIERE';
        localStorage.setItem('role', role);
        applyRole();
      } else {
        $('loginPass').value = '';
        $('loginDialog').showModal();
      }
    };

    $('doLoginBtn').onclick = () => {
      if ($('loginUser').value.trim() === 'Gestore' && $('loginPass').value === 'Cecap') {
        role = 'GESTORE';
        localStorage.setItem('role', role);
        $('loginDialog').close();
        applyRole();
      } else {
        showMsg('Credenziali non valide', true);
      }
    };

    $('cancelLoginBtn').onclick = () => $('loginDialog').close();
    document.querySelectorAll('nav button').forEach(b => b.onclick = () => showView(b.dataset.view));
    $('settingsBtn').onclick = () => showView('viewSettings');
    $('backToScannerBtn').onclick = () => showView('viewScanner');

    $('diagBtn').onclick = async () => {
      const out = $('diagOut');
      out.textContent = 'Lettura dati in corso...';
      try {
        const res = await apiGet(Object.assign({ action: 'diag' }, commonParams()));
        out.textContent = res.ok ? res.report : ('ERRORE: ' + (res.error || 'sconosciuto'));
      } catch (e) {
        out.textContent = 'ERRORE: ' + e.message;
      }
    };

    $('saveSettingsBtn').onclick = async () => {
      const rawSheet = $('sSheet').value.trim();
      const gid = extractGid(rawSheet);
      if (gid) settings.sheetGid = gid;
      settings.spreadsheetId = rawSheet;
      settings.sheetTab = $('sSheetTab').value.trim();
      settings.barcodeColumn = normalizeColumnSpec($('sBarcodeCol').value) || settings.barcodeColumn;
      settings.nameColumn = normalizeColumnSpec($('sNameCol').value) || settings.nameColumn;
      settings.descColumn = normalizeColumnSpec($('sDescCol').value) || settings.descColumn;
      settings.photoColumn = normalizeColumnSpec($('sPhotoCol').value) || settings.photoColumn;
      settings.activeQtyColumn = normalizeColumnSpec($('sQtyCol').value) || settings.activeQtyColumn;
      const chosenSource = $('sSource').value;
      if (chosenSource === 'local') {
        if (settings.localSheetData) {
          settings.sourceType = 'local';
        } else {
          settings.sourceType = detectSourceType(settings.spreadsheetId || '');
          showMsg('Nessun file locale caricato: uso il foglio Google.', true);
        }
      } else {
        settings.sourceType = detectSourceType(settings.spreadsheetId || '');
      }
      saveSettings();
      loadMeta();
      renderLocalInfo();
      showMsg('Impostazioni salvate. Sorgente attiva: ' + (settings.sourceType === 'local' ? 'FILE LOCALE' : 'FOGLIO GOOGLE/DRIVE') + '.');
    };

    $('loadLocalFileBtn').onclick = () => {
      const file = $('sLocalFile').files[0];
      if (!file) {
        showMsg('Seleziona un file Excel o CSV.', true);
        return;
      }
      if (typeof XLSX === 'undefined') {
        showMsg('Libreria Excel non caricata: serve connessione internet.', true);
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const binary = e.target.result;
          const workbook = XLSX.read(binary, { type: 'array' });
          const tabName = (settings.sheetTab && workbook.SheetNames.includes(settings.sheetTab)) ? settings.sheetTab : workbook.SheetNames[0];
          // FIX: matrice posizionale ancorata ad A1: la colonna K è SEMPRE l'indice 10
          const matrix = matrixFromWorksheet(workbook.Sheets[tabName]);
          const table = tableFromMatrix(matrix);
          settings.localSheetData = { headers: table.headers, matrix: table.rows };
          settings.sourceType = 'local';
          saveSettings();
          loadMeta();
          $('sSource').value = 'local';
          renderLocalInfo();
          showMsg('File locale caricato (' + table.rows.length + ' righe, colonne fino a ' + columnLetterFromIndex(Math.max(table.headers.length - 1, 0)) + '). Controlla qui sotto i nomi delle colonne A, E, K, Q.');
        } catch (err) {
          showMsg('Errore file locale: ' + err.message, true);
        }
      };
      reader.readAsArrayBuffer(file);
    };

    applyRole();
    fillSettingsForm();
    loadMeta();
    showView('viewScanner');
  </script>
</body>
</html>
