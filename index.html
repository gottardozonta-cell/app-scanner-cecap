  dialog { border:none; border-radius:12px; padding:20px; width:90%; max-width:400px; }
  dialog::backdrop { background:rgba(0,0,0,0.5); }

<script>
const $ = id => document.getElementById(id);
const DEFAULTS = { scriptUrl:'', token:'', spreadsheetId:'', sourceType:'sheet', barcodeColumn:'E', nameColumn:'C', descColumn:'F', photoColumn:'P', activeQtyColumn:'K', localSheetData: null };

let settings = loadSettings();
let role = localStorage.getItem('role') || 'MAGAZZINIERE';
let columnsMeta = [];
let currentProduct = null;
let historyStack = [];
let lastScan = { code:null, time:0 };
let scanner = null;
let autoQueue = [];
let autoIndex = 0;
let autoMode = false;

function normalizeSpreadsheetId(value){
  if(!value) return '';
  const raw = String(value).trim();
  if(!raw) return '';

  const drivePatterns = [
    /(?:https?:\/\/)?drive\.google\.com\/file\/d\/([a-z0-9_-]{10,})/i,
    /(?:https?:\/\/)?drive\.google\.com\/d\/([a-z0-9_-]{10,})/i,
    /(?:https?:\/\/)?drive\.google\.com\/open\?id=([a-z0-9_-]{10,})/i,
    /(?:[?&]id=)([a-z0-9_-]{10,})/i,
    /(?:https?:\/\/)?docs\.google\.com\/spreadsheets\/d\/([a-z0-9_-]{10,})/i,
    /(?:https?:\/\/)?docs\.google\.com\/d\/([a-z0-9_-]{10,})/i,
    /(?:https?:\/\/)?spreadsheets\.google\.com\/d\/([a-z0-9_-]{10,})/i,
    /key=([a-z0-9_-]+)/i,
    /^([a-z0-9_-]{10,})$/i
  ];

  for (const pattern of drivePatterns) {
    const m = raw.match(pattern);
    if (m && m[1]) return m[1];
  }

  try {
    const u = new URL(raw);
    const path = (u.pathname || '').toLowerCase();
    const host = (u.hostname || '').toLowerCase();
    if (host.includes('docs.google.com') || host.includes('drive.google.com')) {
      const m = path.match(/\/spreadsheets\/d\/([a-z0-9_-]{10,})/i) || path.match(/\/d\/([a-z0-9_-]{10,})/i) || path.match(/\/file\/d\/([a-z0-9_-]{10,})/i);
      if (m && m[1]) return m[1];
      const qid = u.searchParams.get('id');
      if (qid && /^[a-z0-9_-]{10,}$/i.test(qid)) return qid;
    }
  } catch (e) {}

  return raw;
}

function detectSourceType(value){
  const raw = (value || '').trim();
  if (!raw) return 'sheet';
  const low = raw.toLowerCase();
  if (low.includes('drive.google.com') || low.includes('/file/d/') || (low.includes('/d/') && low.includes('drive.google.com'))) return 'drive';
  if (low.includes('docs.google.com/spreadsheets') || low.includes('/spreadsheets/d/')) return 'sheet';
  return 'sheet';
}

function loadSettings(){
  try {
    const parsed = JSON.parse(localStorage.getItem('settings')||'{}');
    const normalized = Object.assign({}, DEFAULTS, parsed);
    const rawSpreadsheet = parsed.spreadsheetId || normalized.spreadsheetId || '';
    if (rawSpreadsheet) normalized.spreadsheetId = normalizeSpreadsheetId(rawSpreadsheet);
    normalized.sourceType = detectSourceType(rawSpreadsheet || normalized.spreadsheetId || '');
    normalized.localSheetData = parsed.localSheetData || normalized.localSheetData || null;
    return normalized;
  } catch(e) {
    return Object.assign({}, DEFAULTS);
  }
}

function saveSettings(){ localStorage.setItem('settings', JSON.stringify(settings)); }

function isAppsScriptUrl(url){
  if(!url) return false;
  try {
    const u = new URL(url);
    const host = (u.hostname || '').toLowerCase();
    const path = (u.pathname || '').toLowerCase();
    return host.includes('script.google.com') && /(?:\/exec|\/dev)(?:[?#]|$)/.test(path);
  } catch (e) {
    return false;
  }
}

function columnLetterFromIndex(index){
  let n = index + 1;
  let letters = '';
  while (n > 0) {
    const rem = (n - 1) % 26;
    letters = String.fromCharCode(65 + rem) + letters;
    n = Math.floor((n - 1) / 26);
  }
  return letters;
}

function columnIndexFromLetter(letter){
  const name = (letter || '').toUpperCase().replace(/[^A-Z]/g,'');
  if(!name) return -1;
  let value = 0;
  for (let i = 0; i < name.length; i++) {
    value = value * 26 + (name.charCodeAt(i) - 64);
  }
  return value - 1;
}

function spreadsheetBaseUrl(sheetId){
  return `https://docs.google.com/spreadsheets/d/${sheetId}`;
}

function googleSheetGvizUrl(sheetId, sheetName){
  const name = (sheetName || '').trim();
  const base = spreadsheetBaseUrl(sheetId) + '/gviz/tq?tqx=out:json';
  return name ? `${base}&sheet=${encodeURIComponent(name)}` : `${base}&sheet=${encodeURIComponent('Foglio1')}`;
}

function googleSheetCsvUrl(sheetId){
  return `${spreadsheetBaseUrl(sheetId)}/export?format=csv&gid=0`;
}

function googleDriveCsvUrl(fileId){
  return `https://drive.google.com/uc?export=download&id=${fileId}`;
}

function parseGoogleSheetResponse(text){
  const normalized = (text || '').trim();
  if (!normalized) return { headers: [], rows: [] };

  try {
    const cleaned = normalized
      .replace(/^\s*\]\s*}'\s*/i, '')
      .replace(/^\s*\/\*.*?\*\/\s*/s, '')
      .replace(/^\s*google\.visualization\.Query\.setResponse\s*\(/, '')
      .replace(/\)\s*;?\s*$/, '');
    const payload = JSON.parse(cleaned);
    const cols = payload && payload.table && payload.table.cols ? payload.table.cols : [];
    const rows = payload && payload.table && payload.table.rows ? payload.table.rows : [];
    const headers = cols.map(c => (c && (c.label || c.id)) || '');
    const data = rows.map(r => {
      const values = r && r.c ? r.c : [];
      const row = {};
      headers.forEach((header, index) => {
        row[header] = values[index] && values[index].v !== undefined ? values[index].v : '';
      });
      return row;
    });
    return { headers, rows: data };
  } catch (e) {
    throw new Error('Risposta JSON del foglio Google non valida.');
  }
}

function parseCsvRows(text){
  const rows = [];
  let current = '';
  let row = [];
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const next = text[i + 1];
    if (ch === '"') {
      if (inQuotes && next === '"') {
        current += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (ch === ',' && !inQuotes) {
      row.push(current);
      current = '';
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (ch === '\r' && next === '\n') i++;
      row.push(current);
      if (row.some(cell => cell !== '')) rows.push(row);
      row = [];
      current = '';
    } else {
      current += ch;
    }
  }
  if (current.length || row.length) {
    row.push(current);
    if (row.some(cell => cell !== '')) rows.push(row);
  }
  return rows;
}

function buildColumnsMeta(headers){
  const palette = ['#4CAF50','#FF9800','#2196F3','#9C27B0','#E91E63','#00BCD4','#795548','#607D8B'];
  return headers.map((header, index) => ({
    letter: columnLetterFromIndex(index),
    header: header || ('Colonna ' + columnLetterFromIndex(index)),
    color: palette[index % palette.length]
  }));
}

function getHeaderIndexByColumnSpec(columnSpec, headers){
  if (!columnSpec) return -1;
  const text = String(columnSpec).trim();
  if (!text) return -1;
  const idx = columnIndexFromLetter(text);
  if (idx >= 0) return idx;
  const normalized = text.toLowerCase();
  return headers.findIndex(h => String(h || '').trim().toLowerCase() === normalized);
}

function toNumber(value){
  if (value === null || value === undefined || value === '') return 0;
  const txt = String(value).trim().replace('.', '').replace(',', '.');
  const parsed = Number(txt);
  return Number.isFinite(parsed) ? parsed : 0;
}

function speak(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang='it-IT'; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }
function beep(long){ try{
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.connect(g); g.connect(ctx.destination); o.type='sine';
  o.frequency.value = long?880:660;
  g.gain.setValueAtTime(0.3, ctx.currentTime);
  o.start(); o.stop(ctx.currentTime+(long?0.5:0.15));
}catch(e){} }
function vibrate(long){ if(navigator.vibrate) navigator.vibrate(long?[300,100,300]:150); }
function showMsg(t,isErr){ const m=$('msg'); m.textContent=t||''; m.className='msg'+(isErr?' err':''); }

function normalizeDriveFileUrl(raw){
  if(!raw) return '';
  const value = raw.trim();
  if(!value) return '';
  const googleId = value.match(/(?:\/d\/|id=)([a-z0-9_-]{10,})/i);
  if(googleId && googleId[1]) return 'https://drive.google.com/uc?export=view&id=' + googleId[1];
  if(/^https?:\/\//i.test(value)) return value;
  if(/^[a-z0-9_-]{10,}$/i.test(value)) return 'https://drive.google.com/uc?export=view&id=' + value;
  return value;
}

function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function readPhotoSource(){
  const file = $('fPhoto').files[0];
  const driveValue = $('fPhotoDrive').value.trim();

  if(file){
    if(file.size > 4 * 1024 * 1024){ throw new Error('Foto troppo grande (max 4 MB)'); }
    const b64 = await blobToBase64(file);
    return { photoBase64: b64.split(',')[1], photoMime: file.type || 'image/jpeg', photoName: file.name };
  }

  if(driveValue){
    const url = normalizeDriveFileUrl(driveValue);
    const response = await fetch(url, { mode: 'cors' });
    if(!response.ok) throw new Error('Impossibile leggere il file da Google Drive.');
    const blob = await response.blob();
    const b64 = await blobToBase64(blob);
    return { photoBase64: b64.split(',')[1], photoMime: blob.type || 'image/jpeg', photoName: 'drive-file' };
  }

  return null;
}

function commonParams(){
  return {
    token: settings.token,
    spreadsheetId: settings.spreadsheetId,
    sourceType: settings.sourceType || 'sheet',
    barcodeColumn: settings.barcodeColumn,
    nameColumn: settings.nameColumn,
    descColumn: settings.descColumn,
    photoColumn: settings.photoColumn,
    qtyColumn: settings.activeQtyColumn
  };
}

function localSheetFetch(params){
  const data = settings.localSheetData || JSON.parse(localStorage.getItem('localSheetData') || 'null');
  if (!data || !Array.isArray(data.rows)) {
    return { ok:false, error:'Nessun file locale caricato.' };
  }

  const headers = data.headers || [];
  const rows = data.rows || [];

  if (params.action === 'meta') {
    return { ok:true, columns: buildColumnsMeta(headers) };
  }

  if (params.action === 'getProduct') {
    const barcodeIndex = getHeaderIndexByColumnSpec(params.barcodeColumn, headers);
    const nameIndex = getHeaderIndexByColumnSpec(params.nameColumn, headers);
    const descIndex = getHeaderIndexByColumnSpec(params.descColumn, headers);
    const photoIndex = getHeaderIndexByColumnSpec(params.photoColumn, headers);
    const qtyIndex = getHeaderIndexByColumnSpec(params.qtyColumn, headers);
    const targetCode = String(params.barcode || '').trim();

    const productRow = rows.find(row => {
      const values = headers.map(h => row[h] ?? '');
      const codeValue = barcodeIndex >= 0 ? String(values[barcodeIndex] || '').trim() : '';
      return codeValue === targetCode;
    });

    if (!productRow) return { ok:true, product:null };

    const values = headers.map(h => productRow[h] ?? '');
    return { ok:true, product: {
      barcode: String(values[barcodeIndex] ?? ''),
      name: String(values[nameIndex] ?? ''),
      description: String(values[descIndex] ?? ''),
      photoUrl: String(values[photoIndex] ?? ''),
      quantity: toNumber(values[qtyIndex]),
      qtyColumn: params.qtyColumn
    } };
  }

  if (params.action === 'listProductsForColumn') {
    const barcodeIndex = getHeaderIndexByColumnSpec(params.barcodeColumn, headers);
    const nameIndex = getHeaderIndexByColumnSpec(params.nameColumn, headers);
    const descIndex = getHeaderIndexByColumnSpec(params.descColumn, headers);
    const photoIndex = getHeaderIndexByColumnSpec(params.photoColumn, headers);
    const qtyIndex = getHeaderIndexByColumnSpec(params.qtyColumn, headers);

    const products = [];
    rows.forEach((row, rowIndex) => {
      const values = headers.map(h => row[h] ?? '');
      const barcode = String(values[barcodeIndex] ?? '').trim();
      const qty = toNumber(values[qtyIndex]);
      if (!barcode || qty <= 0) return;
      products.push({
        barcode,
        name: String(values[nameIndex] ?? ''),
        description: String(values[descIndex] ?? ''),
        photoUrl: String(values[photoIndex] ?? ''),
        quantity: qty,
        qtyColumn: params.qtyColumn,
        rowIndex
      });
    });
    return { ok:true, products };
  }

  return { ok:false, error:'Azione non supportata per file locale.' };
}

async function fetchGoogleSheetData(url, label){
  const res = await fetch(url, { cache: 'no-store' });
  const text = await res.text();
  if(!res.ok) {
    throw new Error(label + ' non raggiungibile: ' + res.status + ' ' + res.statusText);
  }
  const trimmed = (text || '').trim();
  if (!trimmed) {
    throw new Error(label + ' ha restituito un contenuto vuoto.');
  }
  if (/^<!doctype html|^<html|text\/html/i.test(trimmed) || trimmed.toLowerCase().includes('<html')) {
    throw new Error('Il foglio non è pubblico oppure l’ID del foglio è errato.');
  }
  return text;
}

async function directSheetFetch(params){
  if(!settings.spreadsheetId){
    return { ok:false, error:'ID foglio Google mancante.' };
  }

  const sheetId = normalizeSpreadsheetId(settings.spreadsheetId);
  const sourceType = (settings.sourceType || detectSourceType(settings.spreadsheetId || ''));

  const urls = [];
  if (sourceType === 'drive') {
    urls.push(googleDriveCsvUrl(sheetId));
  } else {
    urls.push(googleSheetCsvUrl(sheetId));
    urls.push(googleSheetGvizUrl(sheetId, 'Foglio1'));
  }

  let lastError = null;

  for (const url of urls) {
    try {
      const text = await fetchGoogleSheetData(url, 'Foglio Google');
      let headers = [];
      let rows = [];

      if (url.includes('/gviz/')) {
        const parsed = parseGoogleSheetResponse(text);
        headers = parsed.headers;
        rows = parsed.rows;
      } else {
        const csvRows = parseCsvRows(text);
        if (!csvRows.length) throw new Error('Il foglio CSV è vuoto.');
        headers = csvRows[0].map((h, idx) => (h || `Colonna ${columnLetterFromIndex(idx)}`).trim());
        rows = csvRows.slice(1).map(values => {
          const row = {};
          headers.forEach((header, index) => {
            row[header] = values[index] !== undefined ? values[index].trim() : '';
          });
          return row;
        });
      }

      if (params.action === 'meta') {
        return { ok:true, columns: buildColumnsMeta(headers) };
      }

      if (params.action === 'getProduct') {
        const barcodeIndex = getHeaderIndexByColumnSpec(params.barcodeColumn, headers);
        const nameIndex = getHeaderIndexByColumnSpec(params.nameColumn, headers);
        const descIndex = getHeaderIndexByColumnSpec(params.descColumn, headers);
        const photoIndex = getHeaderIndexByColumnSpec(params.photoColumn, headers);
        const qtyIndex = getHeaderIndexByColumnSpec(params.qtyColumn, headers);
        const targetCode = String(params.barcode || '').trim();

        const productRow = rows.find(row => {
          const values = headers.map(h => row[h] ?? '');
          const codeValue = barcodeIndex >= 0 ? String(values[barcodeIndex] || '').trim() : '';
          return codeValue === targetCode;
        });

        if(!productRow) return { ok:true, product:null };

        const values = headers.map(h => productRow[h] ?? '');
        const product = {
          barcode: String(values[barcodeIndex] ?? ''),
          name: String(values[nameIndex] ?? ''),
          description: String(values[descIndex] ?? ''),
          photoUrl: String(values[photoIndex] ?? ''),
          quantity: toNumber(values[qtyIndex]),
          qtyColumn: params.qtyColumn
        };
        return { ok:true, product };
      }

      if (params.action === 'listProductsForColumn') {
        const barcodeIndex = getHeaderIndexByColumnSpec(params.barcodeColumn, headers);
        const nameIndex = getHeaderIndexByColumnSpec(params.nameColumn, headers);
        const descIndex = getHeaderIndexByColumnSpec(params.descColumn, headers);
        const photoIndex = getHeaderIndexByColumnSpec(params.photoColumn, headers);
        const qtyIndex = getHeaderIndexByColumnSpec(params.qtyColumn, headers);

        const products = [];
        rows.forEach((row, rowIndex) => {
          const values = headers.map(h => row[h] ?? '');
          const barcode = String(values[barcodeIndex] ?? '').trim();
          const qty = toNumber(values[qtyIndex]);
          if (!barcode || qty <= 0) return;
          products.push({
            barcode,
            name: String(values[nameIndex] ?? ''),
            description: String(values[descIndex] ?? ''),
            photoUrl: String(values[photoIndex] ?? ''),
            quantity: qty,
            qtyColumn: params.qtyColumn,
            rowIndex
          });
        });

        return { ok:true, products };
      }

      return { ok:false, error:'Azione non supportata.' };
    } catch (err) {
      lastError = err;
      continue;
    }
  }

  return { ok:false, error: lastError ? lastError.message : 'Impossibile leggere il foglio. Verifica ID e permessi del file.' };
}

async function apiGet(params){
  if (settings.sourceType === 'local' && settings.localSheetData) {
    return localSheetFetch(params);
  }

  if (settings.scriptUrl && isAppsScriptUrl(settings.scriptUrl)) {
    const q = Object.entries(params).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
    const sep = settings.scriptUrl.includes('?') ? '&' : '?';
    const url = settings.scriptUrl + sep + q;
    const r = await fetch(url);
    const text = await r.text();
    if(!text) return { ok:false, error:'Nessuna risposta dal server.' };
    const ct = (r.headers.get('content-type') || '').toLowerCase();
    const trimmed = text.trim();
    const looksLikeHtml = trimmed.startsWith('<!doctype html') || trimmed.startsWith('<html') || ct.includes('text/html');
    if(looksLikeHtml){
      throw new Error('Il link inserito non è un endpoint JSON di Apps Script: usa un Web App con /exec oppure lascia vuoto il campo e usa direttamente il foglio Google.');
    }
    try { return JSON.parse(text); }
    catch(e) {
      const preview = text.replace(/\s+/g, ' ').slice(0, 220);
      throw new Error('Risposta non JSON dal backend. Dettaglio: ' + preview);
    }
  }

  if (settings.spreadsheetId) {
    return await directSheetFetch(params);
  }

  if (settings.localSheetData) {
    return localSheetFetch(params);
  }

  throw new Error('Inserisci un link Drive, un ID del foglio Google oppure carica un file locale.');
}

function loadMeta(){
  if(!settings.spreadsheetId && !settings.scriptUrl && !settings.localSheetData){
    showMsg('Vai in IMPOSTAZIONI e inserisci l\'ID del foglio Google, il link Drive o carica un file locale.', true);
    return;
  }
  apiGet(Object.assign({action:'meta'}, commonParams()))
    .then(res=>{
      if(res.ok){
        columnsMeta = res.columns || [];
        renderColIndicator();
        renderColList();
      } else {
        showMsg(res.error || 'Errore nel caricamento del foglio', true);
      }
    })
    .catch(e=>showMsg('Errore collegamento: '+e.message,true));
}

function startScanner(){
  if(scanner) return;
  if(typeof Html5Qrcode==='undefined'){ showMsg('Libreria scanner non caricata: serve connessione internet.',true); return; }
  let formats;
  try{ formats=[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.QR_CODE]; }catch(e){ formats=undefined; }
  scanner = formats ? new Html5Qrcode('camera',{formatsToSupport:formats}) : new Html5Qrcode('camera');
  scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:160}},onScan,()=>{})
    .catch(err=>{ showMsg('Fotocamera non disponibile: '+err,true); scanner=null; });
}
function stopScanner(){ if(scanner){ const s=scanner; scanner=null; s.stop().then(()=>s.clear()).catch(()=>{}); } }

function onScan(code){
  const now=Date.now();
  if(code===lastScan.code && now-lastScan.time<1500) return;
  lastScan={code,time:now};
  handleBarcode(code);
}

function renderQueueList(){
  const queueBox = $('productQueueList');
  const content = $('queueContent');
  if (!autoQueue.length) {
    queueBox.classList.add('hidden');
    content.innerHTML = '';
    return;
  }
  queueBox.classList.remove('hidden');
  content.innerHTML = autoQueue.map((p, idx) => {
    const isCurrent = idx === autoIndex;
    const qty = Number(p.quantity) || 0;
    return `
      <div class="queue-item ${isCurrent ? 'current' : ''}">
        <span>${idx + 1}. ${p.name || 'Prodotto'}</span>
        <strong>${qty}</strong>
      </div>
    `;
  }).join('');
}

function finishAutoSequence(){
  autoMode = false;
  autoQueue = [];
  autoIndex = 0;
  currentProduct = null;
  renderQueueList();
  $('productCard').classList.add('hidden');
  showMsg('FINE LAVORO');
  speak('Fine lavoro');
  beep(true);
  vibrate(true);
}

function showNextAutoProduct(){
  if (!autoQueue.length) {
    finishAutoSequence();
    return;
  }
  if (autoIndex >= autoQueue.length) {
    finishAutoSequence();
    return;
  }

  const product = autoQueue[autoIndex];
  currentProduct = product;
  renderProduct(product, product.quantity);
  renderQueueList();
  showMsg(`Prodotto ${autoIndex + 1} di ${autoQueue.length}: ${product.name || 'Prodotto'} - ${product.quantity} pezzi`);
  speak(`Prodotto ${autoIndex + 1} di ${autoQueue.length} ${product.name || 'Prodotto'} con ${product.quantity} pezzi`);
}

async function startColumnSequence(){
  if (!settings.spreadsheetId && !settings.localSheetData) {
    showMsg('Inserisci prima il foglio Google, il link Drive o carica un file locale.', true);
    return;
  }

  showMsg('Carico prodotti della colonna...');
  try {
    const res = await apiGet(Object.assign({ action: 'listProductsForColumn' }, commonParams()));
    if (!res.ok) {
      showMsg(res.error || 'Errore nella lettura del foglio', true);
      return;
    }

    const items = (res.products || [])
      .filter(p => (p.barcode || '').trim())
      .filter(p => Number(p.quantity) > 0)
      .map(p => ({ ...p }));

    if (!items.length) {
      autoQueue = [];
      autoMode = false;
      autoIndex = 0;
      renderQueueList();
      showMsg('Nessun prodotto con quantità valida in questa colonna.', true);
      speak('Nessun prodotto nella colonna');
      return;
    }

    autoQueue = items;
    autoIndex = 0;
    autoMode = true;
    renderQueueList();
    showNextAutoProduct();
    showMsg('Colonna avviata. Inquadra il codice del prodotto corrente.', false);
  } catch (e) {
    autoQueue = [];
    autoMode = false;
    autoIndex = 0;
    renderQueueList();
    showMsg('Errore caricamento colonna: ' + e.message, true);
    speak('Errore caricamento colonna');
  }
}

function canProcessCurrentProduct(code){
  if (!autoMode || !autoQueue.length) return true;
  const current = autoQueue[autoIndex];
  if (!current) return true;
  return String(code).trim() === String(current.barcode || '').trim();
}

function processAutoProductMatch(code){
  if (!autoMode || !autoQueue.length) return true;
  const current = autoQueue[autoIndex];
  if (!current) {
    finishAutoSequence();
    return false;
  }
  if (String(code).trim() !== String(current.barcode || '').trim()) {
    showMsg('Codice sbagliato: serve ' + (current.name || current.barcode), true);
    speak('Codice sbagliato');
    beep(true);
    return false;
  }
  return true;
}

function handleBarcode(code){
  const normalizedCode = String(code || '').trim();
  showMsg('Ricerca: ' + normalizedCode + ' ...');

  if (autoMode && !processAutoProductMatch(normalizedCode)) {
    return;
  }

  apiGet(Object.assign({action:'getProduct',barcode:normalizedCode}, commonParams()))
    .then(res=>{
      if(!res.ok){ showMsg(res.error,true); speak('Errore'); return; }
      if(!res.product){
        showMsg('Prodotto non presente nel foglio',true); speak('Prodotto non presente'); beep(true); return;
      }

      const p = res.product;
      currentProduct = p;
      const key='count_'+p.barcode+'_'+p.qtyColumn;
      const stored=localStorage.getItem(key);
      const before = stored===null ? p.quantity : parseInt(stored,10) || p.quantity;
      const remaining = Math.max(before - 1, 0);
      localStorage.setItem(key, String(remaining));
      historyStack.push({key, before});
      renderProduct(p, remaining);

      if (autoMode) {
        if (remaining === 0) {
          showMsg('RIGA COMPLETATA: ' + (p.name || 'Prodotto') + '. Passo al successivo.', false);
          speak('Riga completata');
          beep(true);
          vibrate(true);
          autoIndex += 1;
          renderQueueList();
          setTimeout(() => {
            if (autoIndex >= autoQueue.length) {
              finishAutoSequence();
              return;
            }
            showNextAutoProduct();
          }, 900);
          return;
        }

        showMsg('Mancano ' + remaining + ' per ' + (p.name || 'Prodotto'));
        speak('Mancano ' + remaining);
        beep(false);
        vibrate(false);
        return;
      }

      if(remaining===0){ beep(true); vibrate(true); speak('Fatto'); showMsg('COMPLETATO!'); }
      else { beep(false); vibrate(false); speak('Mancano '+remaining); showMsg('Mancano '+remaining); }
    })
    .catch(e=>{ showMsg('Errore: '+e.message,true); speak('Errore di collegamento'); });
}

function renderProduct(p,remaining){
  const done = remaining<=0 && p.quantity>0;
  $('productCard').className='card '+(done?'done':'pending');
  $('pName').textContent=p.name||'Prodotto';
  $('pDesc').textContent=p.description||'';
  $('pCount').textContent=done?'FATTO!':remaining;
  $('pLabel').textContent=done?'PRODOTTO FINITO':'PEZZI RIMANENTI';
  const photoUrl = normalizeDriveFileUrl(p.photoUrl || '');
  if(photoUrl){ $('pPhoto').src=photoUrl; $('pPhoto').style.display='block'; }
  else $('pPhoto').style.display='none';
  $('productCard').classList.remove('hidden');
}

$('startWorkBtn').onclick=()=>startColumnSequence();
$('startColumnBtn').onclick=()=>startColumnSequence();
$('nextAutoBtn').onclick=()=>{
  if (!autoQueue.length) {
    showMsg('Nessuna colonna in esecuzione.', true);
    return;
  }
  autoIndex += 1;
  if (autoIndex >= autoQueue.length) {
    finishAutoSequence();
    return;
  }
  showNextAutoProduct();
};

$('undoBtn').onclick=()=>{
  if(!historyStack.length){ showMsg('Niente da annullare'); speak('Niente da annullare'); return; }
  const last=historyStack.pop();
  localStorage.setItem(last.key,String(last.before));
  showMsg('Annullato. Riportato a '+last.before); speak('Annullato, mancano '+last.before);
  if(currentProduct) renderProduct(currentProduct,last.before);
};
$('resetColBtn').onclick=()=>{
  if(!confirm('Ricominciare TUTTA la colonna '+settings.activeQtyColumn+' da zero?')) return;
  const col=settings.activeQtyColumn;
  Object.keys(localStorage).filter(k=>k.startsWith('count_')&&k.endsWith('_'+col)).forEach(k=>localStorage.removeItem(k));
  historyStack=[]; $('productCard').className='card pending hidden';
  showMsg('Colonna '+col+' azzerata'); speak('Colonna azzerata');
};
$('resetAllBtn').onclick=()=>{
  if(!confirm('Azzerare TUTTI i conteggi di TUTTE le colonne?')) return;
  Object.keys(localStorage).filter(k=>k.startsWith('count_')).forEach(k=>localStorage.removeItem(k));
  historyStack=[]; $('productCard').className='card pending hidden';
  showMsg('Tutti i conteggi azzerati'); speak('Tutti i conteggi azzerati');
};

function applyRole(){
  const isG = role==='GESTORE';
  $('roleTitle').textContent = isG?'Gestore':'Magazziniere';
  $('authBtn').textContent = isG?'LOGOUT':'LOGIN';
  $('settingsBtn').style.display = isG ? 'inline-block' : 'none';
  $('bottomNav').classList.toggle('hidden',!isG);
  $('resetColBtn').classList.toggle('hidden',!isG);
  $('resetAllBtn').classList.toggle('hidden',!isG);
  $('gestoreSettings').classList.toggle('hidden',!isG);
  $('startColumnBtn').classList.toggle('hidden',!isG);
  $('nextAutoBtn').classList.toggle('hidden',!isG);
  $('startWorkBtn').classList.toggle('hidden', isG);
  if(!isG){ showView('viewScanner'); }
}
$('authBtn').onclick=()=>{
  if(role==='GESTORE'){ role='MAGAZZINIERE'; localStorage.setItem('role',role); applyRole(); speak('Modalità magazziniere'); }
  else { $('loginPass').value=''; $('loginDialog').showModal(); }
};
$('doLoginBtn').onclick=()=>{
  if($('loginUser').value.trim()==='Gestore' && $('loginPass').value==='Cecap'){
    role='GESTORE'; localStorage.setItem('role',role); $('loginDialog').close(); applyRole(); speak('Accesso gestore eseguito');
  } else { showMsg('Credenziali non valide',true); speak('Credenziali non valide'); }
};
$('cancelLoginBtn').onclick=()=>$('loginDialog').close();

function showView(id){
  if(id==='viewSettings' && role!=='GESTORE') id = 'viewScanner';
  ['viewScanner','viewGestore','viewSettings'].forEach(v => $(v).classList.toggle('hidden', v !== id));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === id));
  if(id==='viewScanner') startScanner(); else stopScanner();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showView(b.dataset.view));
$('settingsBtn').onclick=()=>showView('viewSettings');
$('backToScannerBtn').onclick=()=>showView('viewScanner');

function renderColIndicator(){
  const col = columnsMeta.find(c => c.letter === settings.activeQtyColumn);
  $('colIndicator').innerHTML = 'COLONNA: ' + settings.activeQtyColumn +
    (col ? ' <span class="swatch" style="background:' + col.color + '"></span> ' + col.header : '');
}

function renderColList(){
  const c = $('colList'); c.innerHTML='';
  if(!columnsMeta.length){ c.innerHTML='<p>Nessuna colonna caricata. Controlla le impostazioni.</p>'; return; }
  columnsMeta.forEach(col=>{
    const div=document.createElement('div');
    div.className='colitem'+(col.letter===settings.activeQtyColumn?' sel':'');
    div.innerHTML='<span class="swatch" style="background:'+col.color+'"></span><b>'+col.letter+'</b>&nbsp;-&nbsp;'+(col.header||'(senza nome)');
    div.onclick=()=>{ settings.activeQtyColumn=col.letter; saveSettings(); renderColIndicator(); renderColList(); showMsg('Colonna attiva: '+col.letter); speak('Colonna '+col.letter+' attiva'); };
    c.appendChild(div);
  });
}

function fillSettingsForm(){
  $('sSheet').value = settings.spreadsheetId;
  $('sBarcodeCol').value = settings.barcodeColumn;
  $('sNameCol').value = settings.nameColumn;
  $('sDescCol').value = settings.descColumn;
  $('sPhotoCol').value = settings.photoColumn;
  $('sQtyCol').value = settings.activeQtyColumn;
}

async function loadLocalExcelFile(file){
  if (!file) return;
  const ext = (file.name || '').split('.').pop().toLowerCase();
  if (!['xlsx','xls','csv'].includes(ext)) {
    throw new Error('File non valido. Usa .xlsx, .xls oppure .csv');
  }

  const arrayBuffer = await file.arrayBuffer();
  const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
  const firstSheetName = workbook.SheetNames[0];
  const ws = workbook.Sheets[firstSheetName];
  const rowsRaw = XLSX.utils.sheet_to_json(ws, { raw: false, header: 1, defval: '' });
  const rows = rowsRaw.filter(row => Array.isArray(row) && row.some(cell => String(cell ?? '').trim() !== ''));
  if (!rows.length) {
    throw new Error('Il file caricato è vuoto.');
  }

  const headers = rows[0].map((h, idx) => String(h || `Colonna ${columnLetterFromIndex(idx)}`).trim());
  const dataRows = rows.slice(1).map(values => {
    const obj = {};
    headers.forEach((header, index) => { obj[header] = values[index] !== undefined ? String(values[index]) : ''; });
    return obj;
  });

  settings.sourceType = 'local';
  settings.spreadsheetId = '';
  settings.localSheetData = { headers, rows: dataRows, fileName: file.name };
  saveSettings();
  loadMeta();
  showMsg('File locale caricato: ' + file.name);
  speak('File locale caricato');
  showView('viewScanner');
}

$('loadLocalFileBtn').onclick = async () => {
  const file = $('sLocalFile').files[0];
  if (!file) {
    showMsg('Seleziona un file .xlsx, .xls o .csv', true);
    return;
  }
  try {
    await loadLocalExcelFile(file);
  } catch (e) {
    showMsg(e.message || 'Errore nel caricamento del file locale', true);
    speak('Errore caricamento file');
  }
};

$('saveSettingsBtn').onclick=()=>{
  const raw = $('sSheet').value.trim();
  settings.spreadsheetId = normalizeSpreadsheetId(raw);
  settings.sourceType = detectSourceType(raw);
  if(role==='GESTORE'){
    settings.barcodeColumn = $('sBarcodeCol').value.trim().toUpperCase() || 'E';
    settings.nameColumn = $('sNameCol').value.trim().toUpperCase() || 'C';
    settings.descColumn = $('sDescCol').value.trim().toUpperCase() || 'F';
    settings.photoColumn = $('sPhotoCol').value.trim().toUpperCase() || 'P';
    settings.activeQtyColumn = $('sQtyCol').value.trim().toUpperCase() || 'K';
  }
  if (!settings.spreadsheetId) {
    settings.sourceType = settings.localSheetData ? 'local' : 'sheet';
  }
  saveSettings();
  showMsg('Impostazioni salvate');
  loadMeta();
  showView('viewScanner');
};

$('saveProductBtn').onclick=async ()=>{
  if(!$('fBarcode').value.trim()){ showMsg('Inserisci il codice a barre',true); return; }
  if(!settings.spreadsheetId && !settings.scriptUrl && !settings.localSheetData){
    showMsg('Inserisci prima ID del foglio Google, il link Drive o carica un file locale.',true); return;
  }
  if(!settings.scriptUrl && settings.spreadsheetId){
    showMsg('La lettura è diretta dal foglio Google. La scrittura richiede OAuth o un backend Apps Script.',true);
    return;
  }

  const payload = Object.assign({action:'updateProduct'}, commonParams(), {
    barcode: $('fBarcode').value.trim(),
    name: $('fName').value,
    description: $('fDesc').value,
    quantity: parseInt($('fQty').value) || 0
  });

  try {
    const photo = await readPhotoSource();
    if(photo){
      payload.photoBase64 = photo.photoBase64;
      payload.photoMime = photo.photoMime;
      payload.photoName = photo.photoName;
    }
  } catch (e) {
    showMsg(e.message || 'File non leggibile da Google Drive',true);
    return;
  }

  showMsg('Salvataggio in corso...');
  try{
    const res = await fetch(settings.scriptUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    const txt = await res.text();
    let ok = false; try { ok = JSON.parse(txt).ok; } catch (e) { ok = res.ok; }
    showMsg(ok ? 'Articolo salvato nel foglio ✔' : 'Errore nel salvataggio: '+txt, !ok);
    if(ok) speak('Articolo salvato');
  } catch (e) { showMsg('Errore: '+e.message,true); }
};

document.body.addEventListener('touchend',function once(){
  try{ new (window.AudioContext||window.webkitAudioContext)().resume(); }catch(e){}
  if('wakeLock' in navigator){ navigator.wakeLock.request('screen').catch(()=>{}); }
},{once:true});

fillSettingsForm();
applyRole();
renderColIndicator();
loadMeta();
if(!settings.spreadsheetId && !settings.localSheetData && role==='GESTORE') showView('viewSettings');
if(!settings.spreadsheetId && !settings.localSheetData && role!=='GESTORE') showView('viewScanner');
</script>
